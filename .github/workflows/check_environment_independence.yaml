name: Environment Independence Check

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: env-independence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment_independence:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run the tests with the development schema in every environment
        run: uv run python -m scripts.check_environment_independence

      - name: Minimize uv cache
        run: uv cache prune --ci
