name: Codegen Check

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: codegen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen_check:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv and setup the python version
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"

      - name: Install the project with codegen dependencies
        run: uv sync --locked --group codegen

      - name: Build the client from the committed schemas
        run: uv run --group codegen python -m scripts.build_client

      - name: Fail if the committed generated code differs from the build
        run: |
          git add --intent-to-add -- graphql src/gpp_client/generated llms.txt
          git diff --exit-code --stat -- graphql src/gpp_client/generated llms.txt

      - name: Minimize uv cache
        run: uv cache prune --ci
