name: Run Lint and Tests

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Ruff
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run ty check --error-on-warning --output-format=github src/gpp_client

      # The previous tag predates this branch's intended API removals, so the
      # step reports instead of failing.
      - name: Check the public API against the previous release
        continue-on-error: true
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
          echo "Comparing the public API with ${PREVIOUS}"
          REPORT="${RUNNER_TEMP}/griffe.txt"
          uv run griffe check gpp_client -s src --against "${PREVIOUS}" > "${REPORT}" || true
          cat "${REPORT}"
          # Generated code follows GPP's schema; only hand-written API fails.
          if grep -v 'src/gpp_client/generated/' "${REPORT}" | grep -q .; then
            echo "::warning::Hand-written public API changed since ${PREVIOUS}."
            exit 1
          fi

      - name: Minimize uv cache
        run: uv cache prune --ci

  run_tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJson('["3.11"]') || fromJson('["3.11", "3.12", "3.13", "3.14"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run tests (no coverage)
        if: matrix.python-version != '3.11'
        run: |
          uv run pytest -r A -v -n auto

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          uv run pytest -r A -v -n auto --cov --cov-report=xml --cov-branch

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Minimize uv cache
        run: uv cache prune --ci
