fragment ObservationCore on Observation {
  id
  existence
  reference {
    label
  }
  title
  instrument
  calibrationRole
  priority
}

fragment TargetEnvironmentDetails on TargetEnvironment {
  asterism {
    name
    sidereal {
      ...SiderealTargetDetails
    }
    nonsidereal {
      ...NonsiderealTargetDetails
    }
  }
  explicitBase {
    ra {
      hms
    }
    dec {
      dms
    }
  }
}


fragment SchedulingConstraintsDetails on SchedulingConstraints {
  tooActivation
  schedulingMode
  timingWindows {
    inclusion
    startUtc
    end {
      ... on TimingWindowEndAt {
        __typename
        atUtc
      }
      ... on TimingWindowEndAfter {
        __typename
        after {
          seconds
        }
        repeat {
          period {
            seconds
          }
          times
        }
      }
    }
  }

}

fragment ObservationDetails on Observation {
  ...ObservationCore
  observerNotes
  subtitle
  program {
    ...ProgramCore
  }
  scienceRequirements {
    ...ScienceRequirementsDetails
  }
  scienceBand
  workflow {
    ...WorkflowDetails
  }
  observingMode {
    ...ObservingModeDetails
  }
  constraintSet {
    ...ConstraintSetDetails
  }
  timingWindows {
    ...TimingWindowDetails
  }
  targetEnvironment {
    ...TargetEnvironmentDetails
  }
  schedulingConstraints {
   ...SchedulingConstraintsDetails
  }

  execution {
      digest {
        value {
          acquisition {
            timeEstimate {
              total {
                seconds
              }
              program {
                seconds
              }
              nonCharged {
                seconds
              }
            }
          }
          setup {
            full {
              seconds
            }
            reacquisition {
              seconds
            }
          }
        }
      }
  }
  attachments {
    id
    fileName
    attachmentType
    mask {
      name
      instrument
      pixelScale
      dispersionDirection
      scienceSlitCount
      acquisitionSlitCount
    }
  }
}

fragment ObservationAttachmentDetails on Observation {
  attachments {
    id
    fileName
    attachmentType
    mask {
      name
      instrument
      pixelScale
      dispersionDirection
      scienceSlitCount
      acquisitionSlitCount
    }
  }
}
