# =============================================================================
# SchedulerObservationUpdates
# Uses a ObsCalculationUpdate subscription to retrieve update events from
# executed sequences/observations.
# =============================================================================

subscription SchedulerObservationsUpdates($executableOnly: Boolean) {
  obscalcUpdate(input: {executableOnly: $executableOnly, newCalculationState: {EQ: READY}}) {
    oldCalculationState
    newCalculationState
    editType
    value {
      ...ObservationDetails
      observationTime
      program {
        ...ProgramCore
        active {
          start
          end
        }
      }
    }
  }
}

#=============================================================================
# SchedulerExecutedEvents
# Use to track ongoing executions on the ODB
#=============================================================================

subscription SchedulerExecutedEvents {
  executionEventAdded(input: { eventType: { IN: [SEQUENCE, SLEW] } }) {
    value {
      eventType
      id
      ... on SequenceEvent {
        id
        observation {
          id
          reference {
            label
          }
        }
        effectiveTime
        command
        visit {
          site
        }
      }
      ... on SlewEvent {
        id
        recordedTime
        slewStage
        observation {
          id
          reference {
            label
          }
        }
        visit {
          site
        }
      }
    }
  }
}
